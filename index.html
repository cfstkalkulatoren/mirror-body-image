/* Layout: App mit Kopfzeile, Inhalt in einer Lesespalte und fester Tab-Leiste. Farben und Schriften aus dem Flonu-Branding. */
:root {
  --bg: #f1dbca;
  --surface: #f8eadf;
  --fg: #003d30;
  --muted: #365e52;
  --line: #d6b9a2;
  --celery: #cecd58;
  --thyme: #75a151;
  --lemon: #fcc246;
  --mango: #f28f47;
  --pom: #c83e61;
  --on-fill: #003d30;
  --on-pom: #ffffff;
  --font-body: 'Lexend', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
  --font-accent: 'Pacifico', 'Brush Script MT', cursive;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #003d30;
    --surface: #0a4d3f;
    --fg: #f1dbca;
    --muted: #c6b7a7;
    --line: #1f6454;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #003d30;
  --surface: #0a4d3f;
  --fg: #f1dbca;
  --muted: #c6b7a7;
  --line: #1f6454;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--fg);
  font-family: var(--font-body);
  font-size: 16px;
  font-weight: 400;
  line-height: 1.6;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 0 104px;
}
.wrap { max-width: 760px; margin: 0 auto; }
:focus-visible { outline: 3px solid var(--fg); outline-offset: 3px; border-radius: 6px; }
a { color: var(--fg); }
p { margin: 0 0 12px; max-width: 65ch; }
h1 { margin: 0; font-weight: 900; font-size: clamp(2.2rem, 7vw, 3.3rem); line-height: 1.05; text-wrap: balance; }
h2 { margin: 0 0 12px; font-weight: 700; font-size: 1.5rem; line-height: 1.2; text-wrap: balance; }
h3 { margin: 0; font-weight: 700; font-size: 1.1rem; line-height: 1.3; }
.eyebrow { margin: 0 0 6px; font-weight: 600; font-size: 0.74rem; letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted); }
.accent { font-family: var(--font-accent); font-size: clamp(1.25rem, 4vw, 1.7rem); margin: 6px 0 12px; line-height: 1.3; }
.muted { color: var(--muted); }

/* Logos je nach Theme */
.logo-dark { display: none; }
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) .logo-light { display: none; }
  :root:not([data-theme="light"]) .logo-dark { display: block; }
}
:root[data-theme="dark"] .logo-light { display: none; }
:root[data-theme="dark"] .logo-dark { display: block; }

/* Kopfzeile */
.appbar { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding-block: 14px; max-width: 760px; margin: 0 auto; }
.appbar .logo { height: 30px; width: auto; display: block; }
.appbar .logo-dark { display: none; }
.tools-right { display: flex; align-items: center; gap: 8px; }
.seg { display: inline-flex; border: 2px solid var(--fg); border-radius: 999px; overflow: hidden; }
.seg button { font: inherit; font-weight: 600; font-size: 0.78rem; letter-spacing: 0.08em; padding: 6px 12px; border: 0; background: transparent; color: var(--fg); cursor: pointer; min-height: 34px; }
.seg button[aria-pressed="true"] { background: var(--fg); color: var(--bg); }
.icon-btn { width: 38px; height: 38px; border-radius: 50%; border: 2px solid var(--fg); background: transparent; color: var(--fg); display: grid; place-items: center; cursor: pointer; padding: 0; }
.icon-btn svg { width: 18px; height: 18px; }

/* Buttons */
.btn { display: inline-block; font: inherit; font-weight: 600; font-size: 0.85rem; text-transform: uppercase; letter-spacing: 0.05em; padding: 12px 24px; border-radius: 50px; border: 2px solid var(--fg); background: var(--mango); color: var(--on-fill); cursor: pointer; text-decoration: none; text-align: center; }
.btn[disabled] { opacity: 0.45; cursor: not-allowed; }
.btn-quiet { background: transparent; color: var(--fg); }
.row { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }

/* Home */
.hero { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 20px; align-items: center; padding-block: 8px 4px; }
.hero .badge { width: clamp(96px, 24vw, 160px); height: auto; display: block; }
.lead { font-size: 1.02rem; }
.facts { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; margin: 20px 0; }
.facts div { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 10px 12px; min-width: 0; }
.facts dt { font-weight: 900; font-size: 1.3rem; line-height: 1.2; overflow-wrap: anywhere; }
.facts dd { margin: 2px 0 0; font-size: 0.78rem; color: var(--muted); line-height: 1.35; }
.note { background: var(--celery); color: var(--on-fill); border-radius: 14px; padding: 14px 16px; margin: 20px 0; }
.note .eyebrow { color: var(--on-fill); }
.note p:last-child { margin: 0; }

/* Aufklapper */
.acc { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; margin-bottom: 12px; }
.acc > summary { list-style: none; display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 14px 16px; font-weight: 700; cursor: pointer; min-height: 52px; }
.acc > summary::-webkit-details-marker { display: none; }
.acc > summary::after { content: ""; flex: none; width: 9px; height: 9px; border-right: 2.5px solid var(--fg); border-bottom: 2.5px solid var(--fg); transform: rotate(45deg); transition: transform 0.15s; margin-right: 4px; }
.acc[open] > summary::after { transform: rotate(-135deg); }
.acc-body { padding: 0 16px 16px; }
.acc-body > :last-child { margin-bottom: 0; }
@media (prefers-reduced-motion: reduce) { .acc > summary::after { transition: none; } }

.check { display: grid; grid-template-columns: 24px minmax(0, 1fr); gap: 12px; padding: 10px 0; border-top: 1px solid var(--line); cursor: pointer; align-items: start; }
.check:first-of-type { border-top: 0; }
.check input { width: 22px; height: 22px; margin: 2px 0 0; accent-color: var(--fg); }
.result { margin-top: 12px; border-radius: 12px; padding: 12px 14px; background: var(--bg); border: 1px solid var(--line); }
.result.warn { border: 2px solid var(--pom); }
.result p:last-child { margin-bottom: 0; }

.rules { list-style: none; margin: 0; padding: 0; display: grid; gap: 12px; }
.rules li { display: grid; gap: 2px; padding-top: 12px; border-top: 1px solid var(--line); }
.rules li:first-child { border-top: 0; padding-top: 0; }
.rules strong { font-weight: 700; }
.plain { margin: 0 0 12px; padding-left: 1.2rem; max-width: 65ch; }
.plain li { margin-bottom: 6px; padding-left: 4px; }
.plain li::marker { color: var(--muted); }
.flow { margin: 0; padding: 0; list-style: none; display: grid; gap: 10px; }
.flow li { display: grid; gap: 2px; border-top: 3px solid var(--fg); padding-top: 8px; }
.flow strong { font-weight: 600; text-transform: uppercase; letter-spacing: 0.1em; font-size: 0.76rem; }
.levels { list-style: none; margin: 12px 0 0; padding: 0; display: grid; gap: 8px; }
.levels li { display: grid; grid-template-columns: 34px minmax(0, 1fr); gap: 12px; align-items: start; }
.lvl-dot { width: 34px; height: 34px; border-radius: 50%; background: var(--celery); color: var(--on-fill); display: grid; place-items: center; font-weight: 900; font-size: 0.9rem; }
.levels small { display: block; color: var(--muted); }

/* Sessions */
.sec-head { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; flex-wrap: wrap; margin-top: 8px; }
.len { display: flex; flex-wrap: wrap; gap: 10px 14px; align-items: center; margin: 4px 0 18px; }
.len span.lab { font-weight: 600; font-size: 0.76rem; letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted); }
.slist { display: grid; gap: 10px; }
.scard { display: grid; grid-template-columns: 44px minmax(0, 1fr) auto; gap: 14px; align-items: center; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 12px 14px; text-decoration: none; color: var(--fg); }
.scard.next { border: 2px solid var(--fg); }
.num { width: 44px; height: 44px; border-radius: 50%; background: var(--celery); color: var(--on-fill); display: grid; place-items: center; font-weight: 900; font-size: 1.2rem; }
.scard.done .num { background: var(--thyme); color: var(--on-fill); }
.scard h3 { font-size: 1rem; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 4px; }
.chip { display: inline-block; font-weight: 600; font-size: 0.7rem; letter-spacing: 0.08em; text-transform: uppercase; padding: 3px 10px; border-radius: 999px; background: var(--celery); color: var(--on-fill); }
.chip.pom { background: var(--pom); color: var(--on-pom); }
.chip.line { background: transparent; border: 1.5px solid var(--fg); color: var(--fg); }
.state { font-size: 0.78rem; font-weight: 600; color: var(--muted); text-align: right; }

.back { display: inline-flex; align-items: center; gap: 6px; font-weight: 600; font-size: 0.85rem; text-decoration: none; margin: 4px 0 12px; min-height: 40px; }
.back svg { width: 16px; height: 16px; }
.s-head { display: grid; grid-template-columns: 56px minmax(0, 1fr); gap: 14px; align-items: center; margin-bottom: 12px; }
.s-head .num { width: 56px; height: 56px; font-size: 1.6rem; }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 16px; margin-bottom: 14px; }
.panel h3 { margin-bottom: 8px; }
.panel .eyebrow { margin-bottom: 4px; }
.cloth { background: var(--celery); color: var(--on-fill); border-radius: 14px; padding: 12px 16px; margin-bottom: 14px; }
.cloth .eyebrow { color: var(--on-fill); margin-bottom: 2px; }
.cloth p { margin: 0; }
.lock { border: 2px solid var(--pom); border-radius: 14px; padding: 16px; margin-bottom: 14px; }
.lock .chip { margin-bottom: 8px; }

.dots { list-style: none; margin: 8px 0 8px; padding: 0; display: flex; gap: 4px; }
.dots li { flex: 1 1 0; min-width: 0; max-width: 2.8rem; }
.dot { width: 100%; aspect-ratio: 1; border-radius: 50%; border: 0; padding: 0; font: inherit; font-size: 0.8rem; font-weight: 600; font-variant-numeric: tabular-nums; cursor: pointer; background: var(--celery); color: var(--on-fill); display: grid; place-items: center; }
.dot.s-mid { background: var(--lemon); }
.dot.s-high { background: var(--mango); }
.dot.s-max { background: var(--pom); color: var(--on-pom); }
.dot[aria-pressed="true"] { box-shadow: 0 0 0 3px var(--surface), 0 0 0 6px var(--fg); font-weight: 900; }
.legend { display: flex; justify-content: space-between; gap: 8px; margin: 10px 0 0; font-size: 0.76rem; color: var(--muted); max-width: none; }

.steps { margin: 0 0 14px; padding-left: 1.3rem; max-width: 65ch; }
.steps li { margin-bottom: 8px; padding-left: 4px; }
.timer { background: var(--bg); border: 1px solid var(--line); border-radius: 12px; padding: 14px; }
.t-display { font-weight: 900; font-size: 2.6rem; line-height: 1.1; margin: 0 0 8px; font-variant-numeric: tabular-nums; }
.bar { height: 8px; border-radius: 999px; background: var(--line); overflow: hidden; margin-bottom: 12px; }
.bar span { display: block; height: 100%; width: 0; background: var(--fg); }
.t-status { margin: 10px 0 0; font-size: 0.85rem; color: var(--muted); }
.t-status.done { color: var(--fg); font-weight: 600; }

.fb { border-radius: 12px; padding: 12px 14px; margin-top: 12px; background: var(--bg); border: 1px solid var(--line); }
.fb.up { border: 2px solid var(--fg); }
.fb.alert { border: 2px solid var(--pom); }
.fb h4 { margin: 0 0 6px; font-size: 1rem; font-weight: 700; }
.fb p:last-child { margin-bottom: 0; }
.study, .hw { font-size: 0.92rem; border-top: 1px solid var(--line); padding-top: 8px; margin: 12px 0 0; }
.study strong, .hw strong { display: block; font-weight: 600; font-size: 0.72rem; letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted); margin-bottom: 2px; }

.stop { border: 2px solid var(--pom); border-radius: 14px; padding: 18px 16px 8px; margin-bottom: 14px; }
.stop .chip { margin-bottom: 8px; }
.crisis { background: var(--surface); border-radius: 10px; padding: 12px 14px; margin-top: 4px; }
.crisis strong { display: block; }
.refs { margin: 0; padding-left: 1.2rem; font-size: 0.88rem; color: var(--muted); max-width: 65ch; }
.refs li { margin-bottom: 8px; overflow-wrap: anywhere; }
.refs a { color: var(--fg); }

/* Verlauf */
.lrow { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 12px 14px; display: grid; gap: 8px; margin-bottom: 10px; }
.lrow-top { display: flex; justify-content: space-between; gap: 8px; align-items: baseline; flex-wrap: wrap; }
.lrow-top strong { font-weight: 700; }
.bars { display: grid; grid-template-columns: 62px minmax(0, 1fr) 24px; gap: 4px 10px; align-items: center; font-size: 0.78rem; }
.track { height: 10px; border-radius: 999px; background: var(--line); overflow: hidden; }
.track span { display: block; height: 100%; }
.track .b { background: var(--muted); opacity: 0.55; }
.track .a { background: var(--fg); }
.bars output { font-weight: 700; font-variant-numeric: tabular-nums; text-align: right; }
.empty { text-align: center; padding: 24px 12px; }
.empty img { width: 72px; height: auto; display: inline-block; margin-bottom: 8px; }
.empty p { margin-inline: auto; }

/* Rechtliches */
.acc-body h3 { font-size: 1rem; }
.acc-body strong { font-weight: 700; }

/* Tab-Leiste */
.tabbar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 20; background: var(--bg); border-top: 1px solid var(--line); padding-top: 6px; padding-bottom: calc(6px + env(safe-area-inset-bottom, 0px)); padding-left: max(8px, env(safe-area-inset-left, 0px)); padding-right: max(8px, env(safe-area-inset-right, 0px)); }
.tabbar-in { max-width: 760px; margin: 0 auto; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 4px; }
.tab { display: grid; justify-items: center; gap: 2px; padding: 6px 4px; border-radius: 12px; text-decoration: none; color: var(--muted); font-size: 0.68rem; font-weight: 600; letter-spacing: 0.04em; min-height: 52px; align-content: center; }
.tab svg { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.tab[aria-current="page"] { color: var(--on-fill); background: var(--celery); }

.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(84px + env(safe-area-inset-bottom, 0px)); background: var(--fg); color: var(--bg); padding: 10px 18px; border-radius: 999px; font-weight: 600; font-size: 0.85rem; z-index: 30; opacity: 0; pointer-events: none; max-width: calc(100vw - 32px); }
.toast.show { opacity: 1; }

@media (max-width: 600px) {
  .facts { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .scard { grid-template-columns: 44px minmax(0, 1fr); }
  .scard .state { grid-column: 2; text-align: left; }
}
</style>
</head>

          '<span>' + t('logAfter') + '</span><span class="track"><span class="a" style="width:' + (e.a * 10) + '%"></span></span><output>' + e.a + '</output></div></div>';
      });
      h += '<p><button type="button" class="btn btn-quiet" data-act="clear">' + (clearArmed ? t('logClearSure') : t('logClear')) + '</button></p>';
    }
    h += '<p class="muted" style="font-size:.85rem">' + t('logNote') + '</p>';
    return h;
  }


  function legalHTML() {
    var L = t('legal');
    var imp = '<p><strong>Schmelztiegel Holding GmbH</strong><br>Rischerstraße 14<br>69123 Heidelberg, Deutschland</p>' +
      '<p>' + L.rep + '<br>Aleksandrina Angelova-Brandt</p>' +
      '<p>' + L.court + '<br>' + L.reg + '<br>' + L.vat + '<br>' + L.contact + '</p><p>' + L.law + '</p>';
    var priv = listHTML(L.priv) + '<p><button type="button" class="btn btn-quiet" data-act="wipe">' + (wipeArmed ? L.wipeSure : L.wipe) + '</button></p>';
    var health = L.health.map(function (p) { return '<p>' + p + '</p>'; }).join('') +
      '<h3 style="margin-top:16px">' + L.edH + '</h3><p>' + L.ed + '</p><ul class="plain">' + L.help.map(function (x) { return '<li>' + x + '</li>'; }).join('') + '</ul>';
    return '<h2 style="margin-top:24px">' + L.h + '</h2>' + acc(L.impH, imp) + acc(L.privH, priv) + acc(L.healthH, health) +
      '<p class="muted" style="font-size:.85rem;margin-top:20px">' + L.copy + '</p>';
  }

  function infoHTML() {
    var h = '<h2>' + t('infoH') + '</h2>' + stopHTML();
    h += acc(t('accExpect'), listHTML(t('expectList')));
    h += '<h2 style="margin-top:24px">' + t('srcH') + '</h2>';
    h += acc(t('accWhy'), t('why').map(function (p) { return '<p>' + p + '</p>'; }).join(''));
    h += acc(t('accShows'), listHTML(t('shows')));
    h += acc(t('accOpen'), listHTML(t('open')));
    h += acc(t('accRefs'), '<ul class="refs">' + REFS.map(function (r) { return '<li>' + r + '</li>'; }).join('') + '</ul>');
    h += legalHTML();
    return h;
  }

  /* ---------- Timer ---------- */
  function fmt(s) { var m = Math.floor(s / 60), r = s % 60; return (m < 10 ? '0' : '') + m + ':' + (r < 10 ? '0' : '') + r; }
  function tmStop() { if (tm.id) { clearInterval(tm.id); tm.id = null; } }
  function tmReset() { tmStop(); tm.total = st.min * 60; tm.left = tm.total; tm.done = false; tmRender(); }
  function tmRender() {
    var d = $('#t-display'); if (!d) return;
    d.textContent = fmt(tm.left);
    var bar = $('#t-bar'); if (bar) bar.style.width = (100 * (tm.total - tm.left) / tm.total) + '%';
    var b = $('#t-toggle'); if (b) b.textContent = tm.id ? t('timerPause') : t('timerStart');
    var s = $('#t-status'); if (s) { s.textContent = tm.done ? t('timerDone') : t('timerHint'); s.classList.toggle('done', tm.done); }
  }
  function tmTick() {
    tm.left = Math.max(0, Math.round((tm.end - Date.now()) / 1000));
    if (tm.left === 0) { tmStop(); tm.done = true; }
    tmRender();
  }
  function tmToggle() {
    if (tm.id) { tmStop(); tmRender(); return; }
    if (tm.left === 0) { tm.left = tm.total; tm.done = false; }
    tm.end = Date.now() + tm.left * 1000;
    tm.id = setInterval(tmTick, 250);
    tmRender();
  }

  /* ---------- Rendering / Routing ---------- */
  function route() {
    var h = (location.hash || '').replace('#', '');
    var m = /^session-(\d+)$/.exec(h);
    if (m && Number(m[1]) >= 1 && Number(m[1]) <= 10) return { name: 'session', no: Number(m[1]) };
    if (h === 'sessions' || h === 'log' || h === 'info') return { name: h };
    return { name: 'start' };
  }
  var lastRoute = '';
  function render() {
    var r = route();
    tmStop();
    var key = r.name + (r.no || '');
    if (key !== lastRoute) { clearArmed = false; if (r.name === 'session') { tm.total = st.min * 60; tm.left = tm.total; tm.done = false; if (!draft[r.no] && st.log[r.no]) draft[r.no] = { b: st.log[r.no].b, a: st.log[r.no].a }; } }
    var html = '';
    if (r.name === 'start') html = homeHTML();
    else if (r.name === 'sessions') html = sessionsHTML();
    else if (r.name === 'session') html = sessionHTML(r.no);
    else if (r.name === 'log') html = logHTML();
    else html = infoHTML();
    $('#screen').innerHTML = html;
    $('#brand').innerHTML = brand();
    var activeTab = r.name === 'session' ? 'sessions' : r.name;
    $('#tabbar').innerHTML = '<div class="tabbar-in">' + ['start', 'sessions', 'log', 'info'].map(function (k) {
      return '<a class="tab" href="#' + k + '"' + (k === activeTab ? ' aria-current="page"' : '') + '>' + ICONS[k] + '<span>' + T[st.lang].tabs[k] + '</span></a>';
    }).join('') + '</div>';
    $$('[data-act="lang"]').forEach(function (b) { b.setAttribute('aria-pressed', b.getAttribute('data-v') === st.lang ? 'true' : 'false'); });
    applyTheme();
    if (r.name === 'session') { tmRender(); updateSave(r.no); }
    if (key !== lastRoute) window.scrollTo(0, 0);
    lastRoute = key;
  }

  function updateSave(no) {
    var b = $('#save'); if (!b) return;
    var d = draft[no]; var ok = d && d.b != null && d.a != null;
    b.disabled = !ok;
    var hint = $('#save-hint'); if (hint) hint.textContent = ok ? '' : t('saveHint');
  }

  /* ---------- Ereignisse ---------- */
  document.addEventListener('click', function (e) {
    var el = e.target.closest('[data-act]'); if (!el) return;
    var act = el.getAttribute('data-act'), r = route();
    if (act === 'lang') { st.lang = el.getAttribute('data-v'); save(); render(); }
    else if (act === 'theme') { st.theme = effectiveDark() ? 'light' : 'dark'; save(); applyTheme(); }
    else if (act === 'min') {
      st.min = Number(el.getAttribute('data-v')); save();
      $$('[data-act="min"]').forEach(function (b) { b.setAttribute('aria-pressed', Number(b.getAttribute('data-v')) === st.min ? 'true' : 'false'); });
      var chip = $('.chip.line'); if (chip && r.name === 'session') chip.textContent = st.min + ' ' + t('min');
      tmReset();
    }
    else if (act === 'scale' && r.name === 'session') {
      var w = el.getAttribute('data-w'), v = Number(el.getAttribute('data-v'));
      draft[r.no] = draft[r.no] || { b: null, a: null };
      draft[r.no][w] = v;
      $$('[data-act="scale"][data-w="' + w + '"]').forEach(function (b) { b.setAttribute('aria-pressed', Number(b.getAttribute('data-v')) === v ? 'true' : 'false'); });
      $('#fb').innerHTML = feedbackHTML(r.no);
      updateSave(r.no);
    }
    else if (act === 't-toggle') tmToggle();
    else if (act === 't-reset') tmReset();
    else if (act === 'save' && r.name === 'session') {
      var d = draft[r.no]; if (!d || d.b == null || d.a == null) return;
      st.log[r.no] = { b: d.b, a: d.a, min: st.min, ts: Date.now() };
      save(); toast(t('saved')); location.hash = '#sessions';
    }
    else if (act === 'wipe') {
      if (!wipeArmed) { wipeArmed = true; el.textContent = t('legal').wipeSure; setTimeout(function () { if (wipeArmed) { wipeArmed = false; if (el.isConnected) el.textContent = t('legal').wipe; } }, 4000); }
      else {
        wipeArmed = false;
        var keepLang = st.lang;
        try { localStorage.removeItem(KEY); } catch (e2) {}
        st = { lang: keepLang, theme: '', min: 10, checks: {}, coachOk: false, s8ok: false, log: {} };
        draft = {}; lastRoute = ''; applyTheme(); render(); toast(t('legal').wiped);
      }
    }
    else if (act === 'clear') {
      if (!clearArmed) { clearArmed = true; el.textContent = t('logClearSure'); setTimeout(function () { clearArmed = false; if (route().name === 'log') render(); }, 4000); }
      else { st.log = {}; draft = {}; clearArmed = false; save(); render(); }
    }
  });

  document.addEventListener('change', function (e) {
    var el = e.target; if (!el.matches || !el.matches('input[data-chk]')) return;
    var k = el.getAttribute('data-chk');
    if (k === 'coach') { st.coachOk = el.checked; save(); }
    else if (k === 'coach-lock') { st.coachOk = el.checked; save(); render(); }
    else if (k === 's8') { st.s8ok = el.checked; save(); render(); }
    else {
      st.checks[k] = el.checked;
      if (!anyChecked().any) st.coachOk = false;
      save();
      var res = $('#screen-result'); if (res) res.innerHTML = resultHTML();
    }
  });

  window.addEventListener('hashchange', render);

  load();
  applyTheme();
  render();
})();
</script>

</body>
</html>
